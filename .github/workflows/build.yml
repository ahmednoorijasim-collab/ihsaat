name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk ihsaat.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ihsaat-APK
          path: ihsaat.apk
      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: الإحصائيات — آخر نسخة
          body: "حمّل ملف ihsaat.apk وثبّته على هاتف أندرويد."
          files: ihsaat.apk
          make_latest: true
