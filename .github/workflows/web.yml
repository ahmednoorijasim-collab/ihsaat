name: iPhone web version
# Copies the app's web files into docs/ so GitHub Pages serves the same app for iPhone.
on:
  push:
    branches: [main]
    paths: ["app/src/main/assets/www/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf docs
          cp -r app/src/main/assets/www docs
          touch docs/.nojekyll
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A docs
          git diff --cached --quiet || (git commit -m "Update iPhone web version" && git push)
